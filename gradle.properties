# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.hyphentechnology.bitbucketcompanion
pluginName = Bitbucket Companion
pluginRepositoryUrl = https://github.com/sashveer-ramjathan/bitbucket-companion-plugin
# SemVer format -> https://semver.org
pluginVersion = 0.1.0

# Plugin's vendor - single place to change plugin authorship metadata
pluginVendorName = Sashveer Ramjathan
pluginVendorEmail = sashveer.ramjathan@entelect.co.za
pluginVendorUrl = https://github.com/sashveer-ramjathan

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html for description
pluginSinceBuild = 241
pluginUntilBuild =

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-extension.html
platformType = IC
platformVersion = 2024.1

# Plugin Verifier integration -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-plugin-verifier.html
pluginVerifierIdeVersions = 2024.1

# Opt-out flag for bundling Kotlin standard library.
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

org.gradle.jvmargs = -Xmx2g
