# Builds and tests the plugin on every push to master and every pull request - kept fast for a
# tight dev-cycle loop.
#
# The Plugin Verifier check (`verifyPlugin`) lives in release.yml instead, not here. It was
# tried in this fast loop with cache-read-only removed on the theory that a warmed Gradle cache
# would make repeat runs quick - in practice it stayed at ~10+ minutes even on runs that should
# have hit a warm cache (its IDE downloads apparently don't land somewhere gradle/actions/
# setup-gradle actually persists). Rather than keep sinking dev-cycle time chasing that, it's a
# pre-ship concern and belongs at release time, not on every commit.
# Adapted from JetBrains' intellij-platform-plugin-template build workflow.
name: Build

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Run tests
        run: ./gradlew check

      - name: Upload test results on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-result
          path: build/reports/tests
